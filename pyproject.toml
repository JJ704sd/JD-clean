[project]
name = "resume-screening"
dynamic = ["version"]
description = "Auditable one-resume-per-model-call screening pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "keyring==25.6.0",
  "onnxruntime==1.29.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pymupdf==1.28.2",
  "rapidocr==3.9.2",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "resume_screening.versions.APP_VERSION" }

[tool.setuptools]
packages = ["resume_screening"]

[dependency-groups]
build = [
    "pyinstaller==6.22.0",
]
